baseURL: https://qingdazhou.github.io/
locale: en-us
title: 青与AI同行--AI Native Architect Blog
theme: PaperMod
enableRobotsTXT: true

params:
  env: production
  title: "AI Native Architect"
  description: "Software Architecture | AI Engineering | Distributed Systems"

  defaultTheme: auto

  ShowReadingTime: true
  ShowShareButtons: true
  ShowPostNavLinks: true
  ShowCodeCopyButtons: true
  ShowToc: true
  ShowBreadCrumbs: true
  ShowFullTextRSS: true
  comments: false

menu:
  main:

    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10

    - identifier: archives
      name: Archives
      url: /archives/
      weight: 20

    - identifier: search
      name: Search
      url: /search/
      weight: 30

outputs:
  home:
    - HTML
    - RSS
    - JSON